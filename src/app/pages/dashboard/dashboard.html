<div class="dashboard-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Welcome</p>
      <h2>{{ user?.fullName || 'User' }}</h2>
    </div>
    <div class="header-actions">
      <button class="ghost-button" routerLink="/attendance">Mark Attendance</button>
      <button class="ghost-button" (click)="logout()">Logout</button>
    </div>
  </header>

  <section class="user-card">
    <div class="user-summary-row">
      <img *ngIf="user?.profileImage; else defaultUserAvatar" [src]="user.profileImage" alt="User photo" class="user-avatar" />
      <ng-template #defaultUserAvatar>
        <div class="user-avatar default-avatar">{{ (user?.fullName || 'U').charAt(0).toUpperCase() }}</div>
      </ng-template>

      <div>
        <p class="eyebrow">User profile</p>
        <h3>{{ user?.fullName || 'User' }}</h3>
        <p>{{ user?.email || 'No email available' }}</p>
        <span class="status-pill">{{ user?.role || 'USER' }}</span>
      </div>
    </div>
  </section>
</div>
