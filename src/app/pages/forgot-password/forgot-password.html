<div class="recovery-shell">
  <section class="recovery-card" aria-labelledby="recovery-title">
    <a class="brand-row" routerLink="/" aria-label="AttendEase home">
      <span class="brand-icon">A</span>
      <span>AttendEase</span>
    </a>

    <h1 id="recovery-title">Forgot password?</h1>
    <p>
      Ask your administrator to issue a one-time recovery code. It expires after 15 minutes and can only be used once.
    </p>

    <form class="recovery-form" (ngSubmit)="submitForm()" #recoveryForm="ngForm">
      <label>
        <span>User ID</span>
        <input
          type="text"
          name="username"
          [(ngModel)]="form.username"
          autocomplete="username"
          placeholder="user1"
          pattern="user[1-9][0-9]*"
          required
        />
      </label>

      <label>
        <span>One-time recovery code</span>
        <input
          type="text"
          name="recoveryCode"
          [(ngModel)]="form.recoveryCode"
          autocomplete="one-time-code"
          minlength="16"
          maxlength="16"
          autocapitalize="characters"
          required
        />
      </label>

      <label>
        <span>New password</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required
        />
      </label>

      <label>
        <span>Confirm new password</span>
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="form.confirmPassword"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required
        />
      </label>

      <button type="submit" [disabled]="recoveryForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Updating password...' : 'Update password' }}
      </button>
    </form>

    <div
      *ngIf="message"
      class="recovery-message"
      [class.recovery-message-success]="isSuccess"
      [class.recovery-message-error]="!isSuccess"
      role="status"
      aria-live="polite"
    >{{ message }}</div>

    <a class="back-link" routerLink="/login">Back to login</a>
  </section>
</div>
