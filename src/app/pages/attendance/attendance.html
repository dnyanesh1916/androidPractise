  <div *ngIf="message" class="alert-banner" [class.success-message]="isSuccess" [class.error-message]="!isSuccess">

  </div>

  <section class="location-card">
    <div class="card-header-row">
      <span>Location</span>
      <button class="link-button" (click)="requestLocation()">Allow location</button>
    </div>
    <p>{{ locationText }}</p>
  </section>

  <div class="photo-box">
    <div class="photo-actions">
      <button type="button" class="photo-button" (click)="openCamera()" [disabled]="isCameraLoading">
        {{ isCameraLoading ? 'Opening camera...' : (isCameraOpen ? 'Camera is live' : 'Take live photo') }}
      </button>
      <button *ngIf="isCameraOpen" type="button" class="capture-button" (click)="capturePhoto()" [disabled]="!isCameraReady">
        Capture
      </button>
      <button *ngIf="isCameraOpen" type="button" class="close-camera-button" (click)="closeCamera()">
        Close
      </button>
    </div>

    <video *ngIf="isCameraOpen" #cameraVideo autoplay playsinline muted class="camera-preview"></video>

    <img *ngIf="faceData && !isCameraOpen" [src]="faceData" alt="Captured face preview" class="face-preview" />
  </div>

  <div class="action-grid">
    <button class="primary-button" (click)="markAttendance('CHECK_IN')" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Processing...' : 'Check In' }}
    </button>
    <button class="secondary-button" (click)="markAttendance('CHECK_OUT')" [disabled]="isSubmitting">
      Check Out
    </button>
  </div>
