<div class="register-shell">
  <section class="register-card">
    <a class="brand-row" routerLink="/" aria-label="AttendEase home">
      <span class="brand-icon">A</span>
      <span>AttendEase</span>
    </a>

    <h1>Create your account</h1>
    <p class="subtitle">Enter your details to get started.</p>

    <form class="register-form" (ngSubmit)="submitForm()" #registerForm="ngForm">
      <div class="form-field">
        <label for="fullName">Full name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
          [(ngModel)]="form.fullName"
        >
      </div>

      <div class="form-field">
        <label for="email">Work email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@company.com"
          autocomplete="email"
          required
          [(ngModel)]="form.email"
        >
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          required
          [(ngModel)]="form.password"
        >
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Enter your password again"
          autocomplete="new-password"
          required
          [(ngModel)]="form.confirmPassword"
        >
      </div>

      <div class="photo-box">
        <div class="photo-actions">
          <button type="button" class="photo-button" (click)="openCamera()" [disabled]="isCameraLoading">
            {{ isCameraLoading ? 'Opening camera...' : (isCameraOpen ? 'Camera is live' : 'Take live photo') }}
          </button>
          <button *ngIf="isCameraOpen" type="button" class="capture-button" (click)="capturePhoto()">
            Capture
          </button>
        </div>

        <video *ngIf="isCameraOpen" #registerCameraVideo autoplay playsinline muted class="camera-preview"></video>
        <img *ngIf="profileImage && !isCameraOpen" [src]="profileImage" alt="Profile preview" class="profile-preview" />

        <label class="upload-box">
          <span>Upload photo instead</span>
          <input type="file" accept="image/*" capture="user" (change)="onPhotoSelected($event)" />
        </label>
      </div>

      <div *ngIf="message" [class.success-message]="isSuccess" [class.error-message]="!isSuccess">
        {{ message }}
      </div>

      <button type="submit" class="register-button" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <div class="switch-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>
  </section>
</div>
