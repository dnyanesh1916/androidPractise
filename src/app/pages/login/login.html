<div class="auth-shell">
  <div class="auth-card">
    <div class="brand-row">
      <span class="brand-icon">A</span>
      <span>AttendEase</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in with your User ID. Admins can also use their configured admin email.</p>

    <form class="auth-form" (ngSubmit)="submitForm()" #loginForm="ngForm">
      <label>
        <span>User ID or admin email</span>
        <input type="text" name="username" [(ngModel)]="form.username" placeholder="user1 or admin email" autocomplete="username" required />
      </label>

      <label>
        <span>Password</span>
        <input type="password" name="password" [(ngModel)]="form.password" placeholder="••••••••" required />
      </label>

      <div *ngIf="message" [class.success-message]="isSuccess" [class.error-message]="!isSuccess">
        {{ message }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <div class="switch-link">
      Don’t have an account?
      <a routerLink="/register">Create account</a>
    </div>
  </div>
</div>
